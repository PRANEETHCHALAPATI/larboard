name: Sync C++ Coding Guidelines

on:
  schedule:
    - cron: '0 0 * * 1'  # Every Monday at midnight UTC
  workflow_dispatch:      # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout larboard
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Fetch guidelines from cobalt and prepend frontmatter
        run: |
          BASE_URL="https://raw.githubusercontent.com/youtube/cobalt/27.lts/styleguide/c%2B%2B"

          # Ensure the instructions directory exists
          mkdir -p .github/instructions

          # List of files to sync: "source-filename|output-name|description"
          FILES=(
            "c%2B%2B-dos-and-donts.md|c++-dos-and-donts.instructions.md|C++ Dos and Donts guidelines"
            "blink-c%2B%2B.md|blink-c++.instructions.md|Blink C++ coding guidelines"
            "c%2B%2B-features.md|c++-features.instructions.md|C++ approved language features"
            "c%2B%2B.md|c++.instructions.md|C++ style guide"
            "checks.md|checks.instructions.md|C++ checks guidelines"
            "const.md|const.instructions.md|C++ const correctness guidelines"
          )

          for ENTRY in "${FILES[@]}"; do
            SRC="${ENTRY%%|*}"
            REST="${ENTRY#*|}"
            OUT="${REST%%|*}"
            DESC="${REST#*|}"

            curl -sSf "${BASE_URL}/${SRC}" -o /tmp/source.md

            {
              echo '---'
              echo "description: ${DESC} synced from youtube/cobalt"
              echo 'applyTo: "**/*.cpp,**/*.h"'
              echo '---'
              echo ''
              cat /tmp/source.md
            } > ".github/instructions/${OUT}"
          done

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: sync C++ guidelines from youtube/cobalt@27.lts'
          file_pattern: '.github/instructions/*.instructions.md'
